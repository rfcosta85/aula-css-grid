<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design System com Variáveis CSS</title>
    <link rel="stylesheet" href="variaveis.css">
</head>
<body>

    <header class="header">
        <h1>O Nosso Design System</h1>
    </header>

    <main class="grid-layout">
        <article class="card">
            <h2 class="card__title">Produto Premium</h2>
            <p class="card__text">Um exemplo de componente que reutiliza os tokens do nosso sistema.</p>
            <button class="btn btn--primary">Comprar</button>
        </article>

        <article class="card">
            <h2 class="card__title">Produto Standard</h2>
            <p class="card__text">Outro componente perfeitamente alinhado com a identidade visual da marca.</p>
            <button class="btn btn--secondary">Saber Mais</button>
        </article>

        <form class="formulario">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" class="campo-texto" placeholder="Digite aqui...">
            <button class="meu-botao">Enviar Dados</button>
        </form>

    </main>

</body>
</html>
